name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: code formatting
        run: ./gradlew spotlessCheck

      - name: compile
        if: ${{ !cancelled() }}
        run: ./gradlew assemble compileTestJava

      - name: tests
        if: ${{ !cancelled() }}
        run: ./gradlew test
      
      - name: check javadoc
        if: ${{ !cancelled() }}
        run: ./gradlew checkstyleMain checkstyleTest -Pmain=true

